name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q

  # Advisory until a follow-up epic makes it blocking: ruff and mypy have never run
  # on this code, so their first findings are triaged rather than gating merges.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: ruff check (advisory)
        run: ruff check
        continue-on-error: true
      - name: mypy src (advisory)
        run: mypy src
        continue-on-error: true
