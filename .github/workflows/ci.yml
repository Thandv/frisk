name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every supported Python on Linux, plus one macOS job. scripts/verify.sh runs the stdlib
  # unittest suite (on the job's python only, through FRISK_VERIFY_PYTHONS); pytest runs it again
  # with pytest's collection, as the local pre-commit gate does.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - name: scripts/verify.sh
        env:
          FRISK_MIN_PYTHONS: "1"
        run: FRISK_VERIFY_PYTHONS="$(command -v python)" bash scripts/verify.sh
      - run: python -m pytest -q

  # Blocking. Dev tools (the `dev` extra: pytest, ruff, mypy, coverage) are installed only here,
  # never at runtime. Coverage is reported without a floor: the owner sets one from the
  # first CI number. It does not see the CLI tests' child processes, so cli.py reads low.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check
      - run: mypy src
      - run: coverage run -m pytest -q
      - run: coverage report --include='src/frisk/*'

  # The composite Action itself, as a user runs it (uses: ./). sarif is 'false' on both
  # steps: this job has no security-events permission, and the malicious example's planted
  # findings must never reach the Security tab. Its SARIF is checked here instead.
  action-selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Action passes the clean example
        uses: ./
        with:
          targets: examples/clean-skill
          fail-on: block
          sarif: "false"
      - name: Action on the malicious example
        id: malicious
        continue-on-error: true
        uses: ./
        with:
          targets: examples/malicious-skill
          fail-on: block
          sarif: "false"
      - name: The malicious example failed the Action
        env:
          OUTCOME: ${{ steps.malicious.outcome }}
        run: test "$OUTCOME" = failure
      - name: The malicious example's SARIF is well formed
        run: |
          python3 - "$RUNNER_TEMP/frisk.sarif" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              doc = json.load(fh)
          run = doc["runs"][0]
          assert doc["version"] == "2.1.0", doc["version"]
          assert run["tool"]["driver"]["name"] == "frisk", run["tool"]["driver"]
          assert isinstance(run["results"], list) and run["results"], "no results"
          PY
