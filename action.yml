name: "Frisk — AI supply-chain scan"
description: "Scan MCP servers, skills & plugins for malicious code before you install them. Static, local, zero-dependency."
branding:
  icon: "shield"
  color: "red"

inputs:
  targets:
    description: "Space-separated paths and/or git URLs to scan. Local paths are reported relative to the workspace (e.g. 'skills' gives 'skills/foo/SKILL.md'), so SARIF annotations land on repository files for any local path, not only '.'. Git-URL targets are reported relative to their clone and do not map to repository files."
    required: false
    default: "."
  fail-on:
    description: "Fail the job when the worst finding reaches this level: block | warn | never."
    required: false
    default: "block"
  sarif:
    description: "Upload the SARIF frisk writes to $RUNNER_TEMP/frisk.sarif to GitHub code scanning (needs permissions: security-events: write). The file is written either way."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # Inputs reach the scripts only through env, never as ${{ }} inside run:, so a value
    # cannot become shell code. frisk is installed into its own venv, not the runner's python.
    - name: Install frisk
      shell: bash
      env:
        FRISK_ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 -m venv "$RUNNER_TEMP/frisk-venv"
        "$RUNNER_TEMP/frisk-venv/bin/python" -m pip install --quiet "$FRISK_ACTION_PATH"
    - name: Scan
      shell: bash
      env:
        FRISK_TARGETS: ${{ inputs.targets }}
        FRISK_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        # every line of the input, split on whitespace (read stops at its -d '' end with status 1)
        read -r -d '' -a targets <<< "$FRISK_TARGETS" || true
        "$RUNNER_TEMP/frisk-venv/bin/python" -m frisk.cli --fail-on "$FRISK_FAIL_ON" \
          --sarif-out "$RUNNER_TEMP/frisk.sarif" -- "${targets[@]}"
    - name: Upload SARIF
      if: ${{ inputs.sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/frisk.sarif
