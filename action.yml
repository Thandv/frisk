name: "Frisk — AI supply-chain scan"
description: "Scan MCP servers, skills & plugins for malicious code before you install them. Static, local, zero-dependency."
branding:
  icon: "shield"
  color: "red"

inputs:
  targets:
    description: "Space-separated paths and/or git URLs to scan. Local paths are reported relative to the workspace (e.g. 'skills' gives 'skills/foo/SKILL.md'), so SARIF annotations land on repository files for any local path, not only '.'. Git-URL targets are reported relative to their clone and do not map to repository files."
    required: false
    default: "."
  fail-on:
    description: "Fail the job when the worst finding reaches this level: block | warn | never."
    required: false
    default: "block"
  sarif:
    description: "Generate frisk.sarif and upload it to GitHub code scanning."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install frisk
      shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - name: Scan
      shell: bash
      run: frisk ${{ inputs.targets }} --fail-on "${{ inputs.fail-on }}"
    - name: Generate SARIF
      if: ${{ inputs.sarif == 'true' && always() }}
      shell: bash
      run: frisk ${{ inputs.targets }} --sarif --fail-on never > frisk.sarif
    - name: Upload SARIF
      if: ${{ inputs.sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: frisk.sarif
