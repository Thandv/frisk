[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frisk-scan"
version = "0.2.0"
description = "Vet AI-agent content (MCP servers, skills, plugins) for malicious code before you install it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gokul P M" }]
keywords = ["mcp", "security", "ai-agents", "supply-chain", "claude", "scanner", "prompt-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []   # stdlib only — zero third-party dependencies by design

[project.urls]
Homepage = "https://github.com/Thandv/frisk"
Issues = "https://github.com/Thandv/frisk/issues"

[project.optional-dependencies]
# Never needed at runtime. `test` is what the CI test legs install; `dev` adds the
# linters for the separate lint job, so a linter release that drops an old Python
# cannot break the test matrix.
test = ["pytest"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
frisk = "frisk.cli:main"
frisk-mcp = "frisk.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frisk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["corpus", "examples", ".*", "dist", "build"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py39"
line-length = 120   # the existing code's longest line is 112; formatting gets its own ticket

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["frisk.*"]
disallow_untyped_defs = true
